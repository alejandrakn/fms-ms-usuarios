# MS-A · Autenticación (api-usuarios) — FSM SaaS (CS2032)
# Despliegue:  sls deploy --stage dev     (desplegar PRIMERO: los demás MS invocan fsm-<stage>-validar-token)
service: fsm-usuarios
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512        # PBKDF2 en el login necesita algo más de CPU
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole   # Learner Lab: no se crean roles
  environment:
    TABLA_USUARIOS: ${self:custom.tablaUsuarios}
    TABLA_TOKENS: ${self:custom.tablaTokens}
    TOKEN_MINUTOS: 60

custom:
  tablaUsuarios: fsm-${sls:stage}-usuarios
  tablaTokens: fsm-${sls:stage}-tokens

functions:
  login:
    handler: src/auth.login
    events:
      - http: { path: usuarios/login, method: post, cors: true, integration: lambda }

  # Nombre fijo: lo invocan con boto3 los otros 4 microservicios (también se expone por API para el frontend)
  validarToken:
    name: fsm-${sls:stage}-validar-token
    handler: src/auth.validar
    events:
      - http: { path: usuarios/validar, method: post, cors: true, integration: lambda }

  crearUsuario:
    handler: src/usuarios.crear
    events:
      - http: { path: usuarios, method: post, cors: true, integration: lambda }

resources:
  Resources:
    TablaUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaUsuarios}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: user_id, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: user_id, KeyType: RANGE }
    TablaTokens:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaTokens}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: token, AttributeType: S }
        KeySchema:
          - { AttributeName: token, KeyType: HASH }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

package:
  patterns:
    - '!tests/**'
    - '!scripts/**'
    - '!README.md'
    - '!conftest.py'
    - '!.env*'
    - '!.gitignore'
